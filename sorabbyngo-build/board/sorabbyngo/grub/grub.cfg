set default=0
set timeout=3

menuentry "Sorabbyngo OS" {
    linux   /boot/bzImage root=/dev/sda rw console=tty1 console=ttyS0,115200 quiet
    initrd  /boot/rootfs.cpio.gz
}

menuentry "Sorabbyngo OS (serial console)" {
    linux   /boot/bzImage root=/dev/sda rw console=ttyS0,115200 panic=0 ignore_loglevel
    initrd  /boot/rootfs.cpio.gz
}

menuentry "Sorabbyngo OS (QEMU debug)" {
    linux   /boot/bzImage root=/dev/vda rw console=ttyS0,115200 nokaslr debug
    initrd  /boot/rootfs.cpio.gz
}
